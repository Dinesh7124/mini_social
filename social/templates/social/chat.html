{% extends 'social/base.html' %}
{% block title %}Chat with {{ other.username }} — MiniSocial{% endblock %}

{% block content %}
<div class="profile-card">
  <div class="post-header" style="padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);">
    <a href="{% url 'profile' other.username %}" class="avatar">{{ other.username|first }}</a>
    <div class="post-meta">
      <a href="{% url 'profile' other.username %}" class="author">{{ other.username }}</a>
      <span class="time" id="status">● Active</span>
    </div>
    <a href="{% url 'inbox' %}" class="menu-btn" title="Back">←</a>
  </div>

  <div id="chat-messages" style="padding: 1rem; height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem;">
    {% for m in messages %}
    <div class="chat-bubble {% if m.sender == user %}mine{% else %}theirs{% endif %}" data-id="{{ m.id }}">
      <span>{{ m.content }}</span>
      <small>{{ m.created_at|date:"H:i" }}</small>
    </div>
    {% endfor %}
  </div>

  <form id="chat-form" style="display: flex; gap: .5rem; padding: 1rem; border-top: 1px solid var(--border);">
    <input type="text" id="chat-input" placeholder="Type a message..." required
           style="flex: 1; padding: .75rem 1rem; border: 2px solid var(--border); border-radius: 50px; font-family: inherit; font-size: .95rem; outline: none; background: var(--card); color: var(--text);">
    <button type="submit" style="background: var(--primary); color: #fff; border: none; padding: 0 1.5rem; border-radius: 50px; cursor: pointer; font-weight: 700; font-family: inherit;">Send</button>
  </form>
</div>

<script>
const chatBox = document.getElementById('chat-messages');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const otherUser = "{{ other.username }}";
const CSRF = document.cookie.match('(^|;)\\s*csrftoken\\s*=\\s*([^;]+)')?.pop();
let lastId = {{ messages.last.id|default:0 }};

// Scroll to bottom
chatBox.scrollTop = chatBox.scrollHeight;

function appendMessage(msg, isMine) {
  const div = document.createElement('div');
  div.className = 'chat-bubble ' + (isMine ? 'mine' : 'theirs');
  div.dataset.id = msg.id;
  const span = document.createElement('span');
  span.textContent = msg.content;
  const small = document.createElement('small');
  small.textContent = msg.created_at || new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
  div.appendChild(span);
  div.appendChild(small);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const content = chatInput.value.trim();
  if (!content) return;
  chatInput.value = '';

  const res = await fetch(`/api/message/${otherUser}/send/`, {
    method: 'POST',
    headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ content })
  });
  const data = await res.json();
  if (res.ok) {
    appendMessage(data, true);
    lastId = data.id;
  }
});

// Poll for new messages every 3s
setInterval(async () => {
  const res = await fetch(`/api/message/${otherUser}/new/?last_id=${lastId}`);
  const data = await res.json();
  data.messages.forEach(m => {
    if (m.id > lastId) {
      appendMessage(m, m.is_mine);
      lastId = m.id;
    }
  });
}, 3000);
</script>
{% endblock %}
