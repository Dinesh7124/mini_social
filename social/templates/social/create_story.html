{% extends 'social/base.html' %}
{% block title %}Add Story — MiniSocial{% endblock %}

{% block content %}
<div class="profile-card">
  <div class="profile-body" style="padding: 2rem;">
    <h2 style="margin-bottom: 1.5rem;">📸 Add Story</h2>
    <form method="POST" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      <label>Image *</label>
      <input type="file" name="image" accept="image/*" required>

      <label>Caption (optional)</label>
      <input type="text" name="caption" maxlength="200" placeholder="Say something...">

      <button type="submit">Share Story →</button>
    </form>
  </div>
</div>
{% endblock %}
